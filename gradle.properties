# FakeScreen V2 build configuration
# Memory limits are deliberately modest so the project also builds on
# low-memory devices / CI runners.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.configureondemand=false
org.gradle.daemon=true

kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=false
